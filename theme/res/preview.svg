<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e26"/>
      <stop offset="100%" stop-color="#16161c"/>
    </linearGradient>
    <filter id="kshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#101014"/>
    </filter>
  </defs>

  <rect width="640" height="520" rx="18" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="320" y="38" text-anchor="middle" fill="#8b9dc3" font-size="12" letter-spacing="3">CHAOYUE IME · THEME</text>
  <text x="320" y="66" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">小鹤主题（双拼）</text>
  <text x="320" y="88" text-anchor="middle" fill="#888888" font-size="12">by _647Uni · v1.0.0 · HarmonyOS</text>

  <!-- 候选栏 -->
  <rect x="24" y="104" width="592" height="42" rx="10" fill="#242430"/>
  <text x="44" y="131" fill="#7aa2f7" font-size="16" font-weight="600">小鹤</text>
  <line x1="44" y1="137" x2="76" y2="137" stroke="#7aa2f7" stroke-width="2"/>
  <text x="98" y="131" fill="#aaaaaa" font-size="16">销号</text>
  <text x="158" y="131" fill="#aaaaaa" font-size="16">消耗</text>
  <text x="218" y="131" fill="#aaaaaa" font-size="16">小鹤</text>
  <text x="560" y="130" fill="#666666" font-size="12" text-anchor="end">∞  1/9</text>

  <!-- 编码栏 -->
  <rect x="24" y="156" width="592" height="36" rx="8" fill="#1a1a22"/>
  <text x="44" y="179" fill="#9ece6a" font-size="14" font-family="ui-monospace,Consolas,monospace">xhsp</text>
  <text x="90" y="179" fill="#cccccc" font-size="14">小鹤双拼</text>

  <!-- 键盘 -->
  <!-- 行1 -->
  <g font-size="15" text-anchor="middle">
    <g>
      <rect x="24"  y="204" width="53" height="52" rx="9" fill="#2a2a36" filter="url(#kshadow)"/>
      <text x="63"  y="220" fill="#e0af68" font-size="9"  text-anchor="end">%</text>
      <text x="37"  y="252" fill="#7aa2f7" font-size="9"  text-anchor="start">1</text>
      <text x="50"  y="236" fill="#ffffff">Q</text>
    </g>
    <g>
      <rect x="83"  y="204" width="53" height="52" rx="9" fill="#2a2a36" filter="url(#kshadow)"/>
      <text x="122" y="220" fill="#e0af68" font-size="9" text-anchor="end">+</text>
      <text x="96"  y="252" fill="#7aa2f7" font-size="9" text-anchor="start">2</text>
      <text x="109" y="236" fill="#ffffff">W</text>
    </g>
    <g>
      <rect x="142" y="204" width="53" height="52" rx="9" fill="#2a2a36" filter="url(#kshadow)"/>
      <text x="181" y="220" fill="#e0af68" font-size="9" text-anchor="end">*</text>
      <text x="155" y="252" fill="#7aa2f7" font-size="9" text-anchor="start">3</text>
      <text x="168" y="236" fill="#ffffff">E</text>
    </g>
    <g>
      <rect x="201" y="204" width="53" height="52" rx="9" fill="#2a2a36" filter="url(#kshadow)"/>
      <text x="240" y="220" fill="#e0af68" font-size="9" text-anchor="end">&amp;</text>
      <text x="214" y="252" fill="#7aa2f7" font-size="9" text-anchor="start">4</text>
      <text x="227" y="236" fill="#ffffff">R</text>
    </g>
    <g>
      <rect x="260" y="204" width="53" height="52" rx="9" fill="#2a2a36" filter="url(#kshadow)"/>
      <text x="299" y="220" fill="#e0af68" font-size="9" text-anchor="end">±</text>
      <text x="273" y="252" fill="#7aa2f7" font-size="9" text-anchor="start">5</text>
      <text x="286" y="236" fill="#ffffff">T</text>
    </g>
    <g>
      <rect x="319" y="204" width="53" height="52" rx="9" fill="#2a2a36" filter="url(#kshadow)"/>
      <text x="358" y="220" fill="#e0af68" font-size="9" text-anchor="end">×</text>
      <text x="332" y="252" fill="#7aa2f7" font-size="9" text-anchor="start">6</text>
      <text x="345" y="236" fill="#ffffff">Y</text>
    </g>
    <g>
      <rect x="378" y="204" width="53" height="52" rx="9" fill="#2a2a36" filter="url(#kshadow)"/>
      <text x="417" y="220" fill="#e0af68" font-size="9" text-anchor="end">\</text>
      <text x="391" y="252" fill="#7aa2f7" font-size="9" text-anchor="start">7</text>
      <text x="404" y="236" fill="#ffffff">U</text>
    </g>
    <g>
      <rect x="437" y="204" width="53" height="52" rx="9" fill="#2a2a36" filter="url(#kshadow)"/>
      <text x="476" y="220" fill="#e0af68" font-size="9" text-anchor="end">↵</text>
      <text x="450" y="252" fill="#7aa2f7" font-size="9" text-anchor="start">8</text>
      <text x="463" y="236" fill="#ffffff">I</text>
    </g>
    <g>
      <rect x="496" y="204" width="53" height="52" rx="9" fill="#2a2a36" filter="url(#kshadow)"/>
      <text x="535" y="220" fill="#e0af68" font-size="9" text-anchor="end">°</text>
      <text x="509" y="252" fill="#7aa2f7" font-size="9" text-anchor="start">9</text>
      <text x="522" y="236" fill="#ffffff">O</text>
    </g>
    <g>
      <rect x="555" y="204" width="61" height="52" rx="9" fill="#2a2a36" filter="url(#kshadow)"/>
      <text x="602" y="220" fill="#e0af68" font-size="9" text-anchor="end">$</text>
      <text x="568" y="252" fill="#7aa2f7" font-size="9" text-anchor="start">0</text>
      <text x="585" y="236" fill="#ffffff">P</text>
    </g>
  </g>

  <!-- 行2（功能键，深色） -->
  <g font-size="15" text-anchor="middle">
    <g>
      <rect x="55"  y="264" width="53" height="50" rx="9" fill="#232330"/>
      <text x="94"  y="279" fill="#e0af68" font-size="9" text-anchor="end">~</text>
      <text x="81"  y="296" fill="#9aa5ce">A</text>
    </g>
    <g>
      <rect x="114" y="264" width="53" height="50" rx="9" fill="#232330"/>
      <text x="153" y="279" fill="#e0af68" font-size="9" text-anchor="end">/</text>
      <text x="140" y="296" fill="#9aa5ce">S</text>
    </g>
    <g>
      <rect x="173" y="264" width="53" height="50" rx="9" fill="#232330"/>
      <text x="212" y="279" fill="#e0af68" font-size="9" text-anchor="end">:</text>
      <text x="199" y="296" fill="#9aa5ce">D</text>
    </g>
    <g>
      <rect x="232" y="264" width="53" height="50" rx="9" fill="#232330"/>
      <text x="271" y="279" fill="#e0af68" font-size="9" text-anchor="end">;</text>
      <text x="258" y="296" fill="#9aa5ce">F</text>
    </g>
    <g>
      <rect x="291" y="264" width="53" height="50" rx="9" fill="#232330"/>
      <text x="330" y="279" fill="#e0af68" font-size="9" text-anchor="end">(</text>
      <text x="317" y="296" fill="#9aa5ce">G</text>
    </g>
    <g>
      <rect x="350" y="264" width="53" height="50" rx="9" fill="#232330"/>
      <text x="389" y="279" fill="#e0af68" font-size="9" text-anchor="end">)</text>
      <text x="376" y="296" fill="#9aa5ce">H</text>
    </g>
    <g>
      <rect x="409" y="264" width="53" height="50" rx="9" fill="#232330"/>
      <text x="448" y="279" fill="#e0af68" font-size="9" text-anchor="end">@</text>
      <text x="435" y="296" fill="#9aa5ce">J</text>
    </g>
    <g>
      <rect x="468" y="264" width="53" height="50" rx="9" fill="#232330"/>
      <text x="507" y="279" fill="#e0af68" font-size="9" text-anchor="end">"</text>
      <text x="494" y="296" fill="#9aa5ce">K</text>
    </g>
    <g>
      <rect x="527" y="264" width="53" height="50" rx="9" fill="#232330"/>
      <text x="566" y="279" fill="#e0af68" font-size="9" text-anchor="end">'</text>
      <text x="553" y="296" fill="#9aa5ce">L</text>
    </g>
  </g>

  <!-- 行3 -->
  <g font-size="15" text-anchor="middle">
    <g>
      <rect x="24" y="322" width="80" height="50" rx="9" fill="#232330"/>
      <text x="64" y="353" fill="#9aa5ce" font-size="13">⇧ Shift</text>
    </g>
    <g>
      <rect x="110" y="322" width="49" height="50" rx="9" fill="#232330"/>
      <text x="145" y="337" fill="#e0af68" font-size="9" text-anchor="end">-</text>
      <text x="134" y="354" fill="#9aa5ce">Z</text>
    </g>
    <g>
      <rect x="165" y="322" width="49" height="50" rx="9" fill="#232330"/>
      <text x="200" y="337" fill="#e0af68" font-size="9" text-anchor="end">_</text>
      <text x="189" y="354" fill="#9aa5ce">X</text>
    </g>
    <g>
      <rect x="220" y="322" width="49" height="50" rx="9" fill="#232330"/>
      <text x="255" y="337" fill="#e0af68" font-size="9" text-anchor="end">#</text>
      <text x="244" y="354" fill="#9aa5ce">C</text>
    </g>
    <g>
      <rect x="275" y="322" width="49" height="50" rx="9" fill="#232330"/>
      <text x="310" y="337" fill="#e0af68" font-size="9" text-anchor="end">?</text>
      <text x="299" y="354" fill="#9aa5ce">V</text>
    </g>
    <g>
      <rect x="330" y="322" width="49" height="50" rx="9" fill="#232330"/>
      <text x="365" y="337" fill="#e0af68" font-size="9" text-anchor="end">!</text>
      <text x="354" y="354" fill="#9aa5ce">B</text>
    </g>
    <g>
      <rect x="385" y="322" width="49" height="50" rx="9" fill="#232330"/>
      <text x="420" y="337" fill="#e0af68" font-size="9" text-anchor="end">=</text>
      <text x="409" y="354" fill="#9aa5ce">N</text>
    </g>
    <g>
      <rect x="440" y="322" width="49" height="50" rx="9" fill="#232330"/>
      <text x="475" y="337" fill="#e0af68" font-size="9" text-anchor="end">…</text>
      <text x="464" y="354" fill="#9aa5ce">M</text>
    </g>
    <g>
      <rect x="495" y="322" width="121" height="50" rx="9" fill="#232330"/>
      <text x="555" y="353" fill="#9aa5ce" font-size="16">⌫</text>
    </g>
  </g>

  <!-- 行4 -->
  <g text-anchor="middle">
    <rect x="24"  y="380" width="112" height="50" rx="10" fill="#2f2f3e"/>
    <text x="80"  y="411" fill="#c0caf5" font-size="13">?123</text>

    <rect x="142" y="380" width="58" height="50" rx="10" fill="#2f2f3e"/>
    <text x="171" y="411" fill="#c0caf5" font-size="16">，</text>

    <rect x="206" y="380" width="196" height="50" rx="10" fill="#2f2f3e"/>
    <text x="304" y="406" fill="#7aa2f7" font-size="15">空格</text>
    <text x="376" y="396" fill="#9aa5ce" font-size="9" text-anchor="end">En</text>

    <rect x="408" y="380" width="208" height="50" rx="10" fill="#2f2f3e"/>
    <text x="512" y="411" fill="#c0caf5" font-size="16">↵</text>
    <text x="596" y="396" fill="#9aa5ce" font-size="11" text-anchor="end">📋</text>
  </g>

  <!-- 图例 -->
  <g font-size="11" fill="#777777">
    <rect x="150" y="450" width="9" height="9" rx="2" fill="#e0af68"/>
    <text x="165" y="459">上滑 = 符号</text>
    <rect x="265" y="450" width="9" height="9" rx="2" fill="#7aa2f7"/>
    <text x="280" y="459">下滑 = 数字</text>
    <rect x="380" y="450" width="9" height="9" rx="2" fill="#9aa5ce"/>
    <text x="395" y="459">功能键</text>
  </g>

  <!-- 特色键 -->
  <g font-size="11" fill="#9aa5ce" text-anchor="middle">
    <rect x="72"  y="474" width="86" height="26" rx="7" fill="#232330"/>
    <text x="115" y="491">` 反查</text>
    <rect x="168" y="474" width="86" height="26" rx="7" fill="#232330"/>
    <text x="211" y="491">🎤 语音</text>
    <rect x="264" y="474" width="86" height="26" rx="7" fill="#232330"/>
    <text x="307" y="491">😀 表情</text>
    <rect x="360" y="474" width="96" height="26" rx="7" fill="#232330"/>
    <text x="408" y="491">📋 剪切板</text>
    <rect x="466" y="474" width="96" height="26" rx="7" fill="#232330"/>
    <text x="514" y="491">🛠 工具面板</text>
  </g>
</svg>
