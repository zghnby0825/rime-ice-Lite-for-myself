<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e26"/>
      <stop offset="100%" stop-color="#16161c"/>
    </linearGradient>
  </defs>

  <rect width="640" height="520" rx="18" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="320" y="38" text-anchor="middle" fill="#8b9dc3" font-size="12" letter-spacing="3">CHAOYUE IME · THEME</text>
  <text x="320" y="66" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">小鹤主题（双拼）</text>
  <text x="320" y="88" text-anchor="middle" fill="#888888" font-size="12">by _647Uni · v1.0.0 · HarmonyOS</text>

  <!-- 候选栏 -->
  <rect x="24" y="104" width="592" height="42" rx="10" fill="#242430"/>
  <text x="44" y="131" fill="#7aa2f7" font-size="16" font-weight="600">小鹤</text>
  <line x1="44" y1="137" x2="76" y2="137" stroke="#7aa2f7" stroke-width="2"/>
  <text x="98" y="131" fill="#aaaaaa" font-size="16">销号</text>
  <text x="158" y="131" fill="#aaaaaa" font-size="16">消耗</text>
  <text x="218" y="131" fill="#aaaaaa" font-size="16">小鹤</text>
  <text x="600" y="130" fill="#666666" font-size="12" text-anchor="end">∞  1/9</text>

  <!-- 编码栏 -->
  <rect x="24" y="156" width="592" height="36" rx="8" fill="#1a1a22"/>
  <text x="44" y="179" fill="#9ece6a" font-size="14" font-family="ui-monospace,Consolas,monospace">xhsp</text>
  <text x="90" y="179" fill="#cccccc" font-size="14">小鹤双拼</text>

  <!-- ===== 键盘 ===== -->
  <!-- 行1: Q..P  每键 x=24+59.8i, w=53.8 -->
  <g font-size="15" text-anchor="middle">
    <g>
      <rect x="24" y="204" width="53.8" height="52" rx="9" fill="#2a2a36"/>
      <text x="75.8" y="221" fill="#e0af68" font-size="9" text-anchor="end">%</text>
      <text x="37" y="253" fill="#7aa2f7" font-size="9" text-anchor="start">1</text>
      <text x="51" y="237" fill="#ffffff">Q</text>
    </g>
    <g>
      <rect x="83.8" y="204" width="53.8" height="52" rx="9" fill="#2a2a36"/>
      <text x="135.6" y="221" fill="#e0af68" font-size="9" text-anchor="end">+</text>
      <text x="96.8" y="253" fill="#7aa2f7" font-size="9" text-anchor="start">2</text>
      <text x="110.8" y="237" fill="#ffffff">W</text>
    </g>
    <g>
      <rect x="143.6" y="204" width="53.8" height="52" rx="9" fill="#2a2a36"/>
      <text x="195.4" y="221" fill="#e0af68" font-size="9" text-anchor="end">*</text>
      <text x="156.6" y="253" fill="#7aa2f7" font-size="9" text-anchor="start">3</text>
      <text x="170.6" y="237" fill="#ffffff">E</text>
    </g>
    <g>
      <rect x="203.4" y="204" width="53.8" height="52" rx="9" fill="#2a2a36"/>
      <text x="255.2" y="221" fill="#e0af68" font-size="9" text-anchor="end">&amp;</text>
      <text x="216.4" y="253" fill="#7aa2f7" font-size="9" text-anchor="start">4</text>
      <text x="230.4" y="237" fill="#ffffff">R</text>
    </g>
    <g>
      <rect x="263.2" y="204" width="53.8" height="52" rx="9" fill="#2a2a36"/>
      <text x="315" y="221" fill="#e0af68" font-size="9" text-anchor="end">±</text>
      <text x="276.2" y="253" fill="#7aa2f7" font-size="9" text-anchor="start">5</text>
      <text x="290.2" y="237" fill="#ffffff">T</text>
    </g>
    <g>
      <rect x="323" y="204" width="53.8" height="52" rx="9" fill="#2a2a36"/>
      <text x="374.8" y="221" fill="#e0af68" font-size="9" text-anchor="end">×</text>
      <text x="336" y="253" fill="#7aa2f7" font-size="9" text-anchor="start">6</text>
      <text x="350" y="237" fill="#ffffff">Y</text>
    </g>
    <g>
      <rect x="382.8" y="204" width="53.8" height="52" rx="9" fill="#2a2a36"/>
      <text x="434.6" y="221" fill="#e0af68" font-size="9" text-anchor="end">\</text>
      <text x="395.8" y="253" fill="#7aa2f7" font-size="9" text-anchor="start">7</text>
      <text x="409.8" y="237" fill="#ffffff">U</text>
    </g>
    <g>
      <rect x="442.6" y="204" width="53.8" height="52" rx="9" fill="#2a2a36"/>
      <text x="494.4" y="221" fill="#e0af68" font-size="9" text-anchor="end">¥</text>
      <text x="455.6" y="253" fill="#7aa2f7" font-size="9" text-anchor="start">8</text>
      <text x="469.6" y="237" fill="#ffffff">I</text>
    </g>
    <g>
      <rect x="502.4" y="204" width="53.8" height="52" rx="9" fill="#2a2a36"/>
      <text x="554.2" y="221" fill="#e0af68" font-size="9" text-anchor="end">°</text>
      <text x="515.4" y="253" fill="#7aa2f7" font-size="9" text-anchor="start">9</text>
      <text x="529.4" y="237" fill="#ffffff">O</text>
    </g>
    <g>
      <rect x="562.2" y="204" width="53.8" height="52" rx="9" fill="#2a2a36"/>
      <text x="614.2" y="221" fill="#e0af68" font-size="9" text-anchor="end">$</text>
      <text x="575.2" y="253" fill="#7aa2f7" font-size="9" text-anchor="start">0</text>
      <text x="589.2" y="237" fill="#ffffff">P</text>
    </g>
  </g>

  <!-- 行2: 空5 + A..L + 空5 -->
  <g font-size="15" text-anchor="middle">
    <rect x="24" y="264" width="26.6" height="50" rx="8" fill="#1a1a22"/>
    <g>
      <rect x="56.6" y="264" width="53.2" height="50" rx="9" fill="#232330"/>
      <text x="108.2" y="280" fill="#e0af68" font-size="9" text-anchor="end">~</text>
      <text x="83.2" y="296" fill="#9aa5ce">A</text>
    </g>
    <g>
      <rect x="115.8" y="264" width="53.2" height="50" rx="9" fill="#232330"/>
      <text x="167.4" y="280" fill="#e0af68" font-size="9" text-anchor="end">/</text>
      <text x="142.4" y="296" fill="#9aa5ce">S</text>
    </g>
    <g>
      <rect x="175" y="264" width="53.2" height="50" rx="9" fill="#232330"/>
      <text x="226.6" y="280" fill="#e0af68" font-size="9" text-anchor="end">:</text>
      <text x="201.6" y="296" fill="#9aa5ce">D</text>
    </g>
    <g>
      <rect x="234.2" y="264" width="53.2" height="50" rx="9" fill="#232330"/>
      <text x="285.8" y="280" fill="#e0af68" font-size="9" text-anchor="end">;</text>
      <text x="260.8" y="296" fill="#9aa5ce">F</text>
    </g>
    <g>
      <rect x="293.4" y="264" width="53.2" height="50" rx="9" fill="#232330"/>
      <text x="345" y="280" fill="#e0af68" font-size="9" text-anchor="end">(</text>
      <text x="320" y="296" fill="#9aa5ce">G</text>
    </g>
    <g>
      <rect x="352.6" y="264" width="53.2" height="50" rx="9" fill="#232330"/>
      <text x="404.2" y="280" fill="#e0af68" font-size="9" text-anchor="end">)</text>
      <text x="379.2" y="296" fill="#9aa5ce">H</text>
    </g>
    <g>
      <rect x="411.8" y="264" width="53.2" height="50" rx="9" fill="#232330"/>
      <text x="463.4" y="280" fill="#e0af68" font-size="9" text-anchor="end">@</text>
      <text x="438.4" y="296" fill="#9aa5ce">J</text>
    </g>
    <g>
      <rect x="471" y="264" width="53.2" height="50" rx="9" fill="#232330"/>
      <text x="522.6" y="280" fill="#e0af68" font-size="9" text-anchor="end">"</text>
      <text x="497.6" y="296" fill="#9aa5ce">K</text>
    </g>
    <g>
      <rect x="530.2" y="264" width="53.2" height="50" rx="9" fill="#232330"/>
      <text x="581.8" y="280" fill="#e0af68" font-size="9" text-anchor="end">'</text>
      <text x="556.8" y="296" fill="#9aa5ce">L</text>
    </g>
    <rect x="589.4" y="264" width="26.6" height="50" rx="8" fill="#1a1a22"/>
  </g>

  <!-- 行3: Shift15 + Z..M + Backspace15 -->
  <g font-size="15" text-anchor="middle">
    <rect x="24" y="322" width="81.6" height="50" rx="9" fill="#232330"/>
    <text x="64.8" y="353" fill="#9aa5ce" font-size="13">⇧</text>
    <g>
      <rect x="111.6" y="322" width="54.4" height="50" rx="9" fill="#232330"/>
      <text x="164.6" y="338" fill="#e0af68" font-size="9" text-anchor="end">-</text>
      <text x="138.8" y="355" fill="#9aa5ce">Z</text>
    </g>
    <g>
      <rect x="172" y="322" width="54.4" height="50" rx="9" fill="#232330"/>
      <text x="225" y="338" fill="#e0af68" font-size="9" text-anchor="end">_</text>
      <text x="199.2" y="355" fill="#9aa5ce">X</text>
    </g>
    <g>
      <rect x="232.4" y="322" width="54.4" height="50" rx="9" fill="#232330"/>
      <text x="285.4" y="338" fill="#e0af68" font-size="9" text-anchor="end">#</text>
      <text x="259.6" y="355" fill="#9aa5ce">C</text>
    </g>
    <g>
      <rect x="292.8" y="322" width="54.4" height="50" rx="9" fill="#232330"/>
      <text x="345.8" y="338" fill="#e0af68" font-size="9" text-anchor="end">?</text>
      <text x="320" y="355" fill="#9aa5ce">V</text>
    </g>
    <g>
      <rect x="353.2" y="322" width="54.4" height="50" rx="9" fill="#232330"/>
      <text x="406.2" y="338" fill="#e0af68" font-size="9" text-anchor="end">!</text>
      <text x="380.4" y="355" fill="#9aa5ce">B</text>
    </g>
    <g>
      <rect x="413.6" y="322" width="54.4" height="50" rx="9" fill="#232330"/>
      <text x="466.6" y="338" fill="#e0af68" font-size="9" text-anchor="end">=</text>
      <text x="440.8" y="355" fill="#9aa5ce">N</text>
    </g>
    <g>
      <rect x="474" y="322" width="54.4" height="50" rx="9" fill="#232330"/>
      <text x="527" y="338" fill="#e0af68" font-size="9" text-anchor="end">…</text>
      <text x="501.2" y="355" fill="#9aa5ce">M</text>
    </g>
    <rect x="534.4" y="322" width="81.6" height="50" rx="9" fill="#232330"/>
    <text x="575.2" y="353" fill="#9aa5ce" font-size="16">⌫</text>
  </g>

  <!-- 行4: 符号25 + 逗号10 + 空格40 + 回车25 -->
  <g text-anchor="middle">
    <rect x="24" y="380" width="143.5" height="50" rx="10" fill="#2f2f3e"/>
    <text x="95.8" y="411" fill="#c0caf5" font-size="14">?123</text>

    <rect x="173.5" y="380" width="57.4" height="50" rx="10" fill="#2f2f3e"/>
    <text x="202.2" y="411" fill="#c0caf5" font-size="16">，</text>

    <rect x="236.9" y="380" width="229.6" height="50" rx="10" fill="#2f2f3e"/>
    <text x="351.7" y="408" fill="#7aa2f7" font-size="15">空格</text>
    <text x="452" y="397" fill="#9aa5ce" font-size="9" text-anchor="end">En</text>

    <rect x="472.5" y="380" width="143.5" height="50" rx="10" fill="#2f2f3e"/>
    <text x="544.2" y="411" fill="#c0caf5" font-size="16">↵</text>
    <text x="602" y="397" fill="#9aa5ce" font-size="11" text-anchor="end">📋</text>
  </g>

  <!-- 宽度比例说明 -->
  <g font-size="10" fill="#666666" text-anchor="middle">
    <text x="95.8" y="446">25</text>
    <text x="202.2" y="446">10</text>
    <text x="351.7" y="446">40</text>
    <text x="544.2" y="446">25</text>
  </g>
  <text x="320" y="446" fill="#555555" font-size="10" text-anchor="middle"></text>

  <!-- 图例 -->
  <g font-size="11" fill="#777777">
    <rect x="150" y="458" width="9" height="9" rx="2" fill="#e0af68"/>
    <text x="165" y="467">上滑 = 符号</text>
    <rect x="265" y="458" width="9" height="9" rx="2" fill="#7aa2f7"/>
    <text x="280" y="467">下滑 = 数字</text>
    <rect x="380" y="458" width="9" height="9" rx="2" fill="#9aa5ce"/>
    <text x="395" y="467">功能键</text>
  </g>

  <!-- 特色键 -->
  <g font-size="11" fill="#9aa5ce" text-anchor="middle">
    <rect x="72" y="480" width="86" height="26" rx="7" fill="#232330"/>
    <text x="115" y="497">` 反查</text>
    <rect x="168" y="480" width="86" height="26" rx="7" fill="#232330"/>
    <text x="211" y="497">🎤 语音</text>
    <rect x="264" y="480" width="86" height="26" rx="7" fill="#232330"/>
    <text x="307" y="497">😀 表情</text>
    <rect x="360" y="480" width="96" height="26" rx="7" fill="#232330"/>
    <text x="408" y="497">📋 剪切板</text>
    <rect x="466" y="480" width="96" height="26" rx="7" fill="#232330"/>
    <text x="514" y="497">🛠 工具面板</text>
  </g>
</svg>
